name: Deploy Next.js to HostGator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci && npm install @next/third-parties --legacy-peer-deps

      - name: Build Next.js App
        run: npx next build
        env:
          NEXT_PUBLIC_CONTACT_AUTH_KEY: ${{ secrets.NEXT_PUBLIC_CONTACT_AUTH_KEY || 'ph_auth_2026_secure_bridge' }}

      - name: Setup SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_rsa
            PubkeyAcceptedAlgorithms ssh-rsa
            PubkeyAcceptedKeyTypes ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to HostGator via native SCP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          shopt -s dotglob
          scp -r -P 2222 out/* ${{ secrets.HOSTGATOR_REMOTE_USER }}@${{ secrets.HOSTGATOR_REMOTE_HOST }}:public_html/

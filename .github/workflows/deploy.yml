name: Deploy Next.js to HostGator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build

      - name: Prepare Standalone Directory
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Setup SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.HOSTGATOR_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2222 -H ${{ secrets.HOSTGATOR_REMOTE_HOST }} >> ~/.ssh/known_hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_rsa
            PubkeyAcceptedAlgorithms ssh-rsa
            PubkeyAcceptedKeyTypes ssh-rsa
            HostKeyAlgorithms +ssh-rsa
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to HostGator via Rsync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rsync -rltgoDzvO --delete -e "ssh -vvv -p 2222" .next/standalone/ ${{ secrets.HOSTGATOR_REMOTE_USER }}@${{ secrets.HOSTGATOR_REMOTE_HOST }}:${{ secrets.HOSTGATOR_TARGET_PATH }}

      - name: Restart Passenger App (Zero-Downtime)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ssh -vvv -p 2222 ${{ secrets.HOSTGATOR_REMOTE_USER }}@${{ secrets.HOSTGATOR_REMOTE_HOST }} "mkdir -p ${{ secrets.HOSTGATOR_TARGET_PATH }}/tmp && touch ${{ secrets.HOSTGATOR_TARGET_PATH }}/tmp/restart.txt"
